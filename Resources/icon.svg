<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7BFF"/>
      <stop offset="0.55" stop-color="#5B4BF0"/>
      <stop offset="1" stop-color="#8A3FD9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9ECF5"/>
    </linearGradient>
    <linearGradient id="capSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9CEE0"/>
      <stop offset="1" stop-color="#A9B0C8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1B0F5C" flood-opacity="0.45"/>
    </filter>
    <filter id="appShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- фон в стиле macOS (поле 100px по краям, как у системных иконок) -->
  <g filter="url(#appShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  </g>

  <!-- стрелки переключения -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="1" stroke-width="34" stroke-linecap="round">
    <path d="M 238 420 A 290 290 0 0 1 560 222"/>
    <path d="M 786 604 A 290 290 0 0 1 464 802"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="1">
    <path d="M 600 222 L 530 172 L 535 270 Z"/>
    <path d="M 424 802 L 494 852 L 489 754 Z"/>
  </g>

  <!-- клавиша -->
  <g filter="url(#shadow)">
    <rect x="322" y="338" width="380" height="380" rx="78" fill="url(#capSide)"/>
    <rect x="322" y="318" width="380" height="372" rx="78" fill="url(#cap)"/>
  </g>
  <!-- диагональ -->
  <line x1="372" y1="640" x2="652" y2="368" stroke="#D3D8E8" stroke-width="8" stroke-linecap="round"/>
  <!-- буквы -->
  <text x="430" y="500" text-anchor="middle" font-family="SF Pro Rounded, Nunito, Arial Rounded MT Bold, Helvetica, Arial, sans-serif"
        font-weight="800" font-size="150" fill="#2A2F45">A</text>
  <text x="596" y="650" text-anchor="middle" font-family="SF Pro Rounded, Nunito, Arial Rounded MT Bold, Helvetica, Arial, sans-serif"
        font-weight="800" font-size="150" fill="#5B4BF0">Я</text>
</svg>
